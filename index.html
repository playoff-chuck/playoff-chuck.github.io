<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Стартап-плей-офф by Chuck</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #efeedf; font-family: system-ui, -apple-system, Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .t { font-weight: 900; font-size: 22px; letter-spacing: .02em; text-transform: uppercase;
       text-shadow: 0 2px 0 #c23a4f, 0 4px 0 #e2702d, 0 6px 0 #f2b31a; margin-bottom: 22px; }
  .dots span { display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%; background: #f2b31a; animation: b 1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .2; transform: scale(.7); } 40% { opacity: 1; transform: scale(1); } }
  .s { color: #9a978a; font-size: 14px; margin-top: 16px; }
  button { margin-top: 18px; background: #f2b31a; color: #1a1000; border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 800; font-size: 16px; }
</style>
</head>
<body>
<div>
  <div class="t">Стартап-плей-офф</div>
  <div id="box"><div class="dots"><span></span><span></span><span></span></div><div class="s">Подключаемся…</div></div>
</div>
<script>
// Стартовая страница: сама выбирает путь к приложению.
// Без VPN открывается krugom.su напрямую; если он недоступен (VPN блокирует российские сайты) —
// запасной вход через Cloudflare. Параметры и данные Telegram (#tgWebAppData…) передаются дальше как есть.
var DIRECT = 'https://krugom.su/playoff/';
var FALLBACK = 'https://playoff.martjusha2075.workers.dev/playoff/';
var PAGES = { '': '', vote: '', profile: 'profile', jury: 'jury', admin: 'admin', screen: 'screen' };

var q = new URLSearchParams(location.search);
var page = PAGES.hasOwnProperty(q.get('p') || '') ? PAGES[q.get('p') || ''] : '';
q.delete('p');
var rest = (q.toString() ? '?' + q.toString() : '') + location.hash;

// доступен ли сервер: любой ответ = доступен, обрыв или тишина дольше лимита = нет
function reachable(base, ms) {
  return new Promise(function (ok) {
    var done = false, t = setTimeout(function () { if (!done) { done = true; ok(false); } }, ms);
    fetch(base + 'css/app.css?ping=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
      .then(function () { if (!done) { done = true; clearTimeout(t); ok(true); } })
      .catch(function () { if (!done) { done = true; clearTimeout(t); ok(false); } });
  });
}
function go(base) { location.replace(base + page + rest); }
function fail() {
  document.getElementById('box').innerHTML = '<div class="s">Не получается подключиться.<br>Проверьте интернет — или включите/выключите VPN и попробуйте снова.</div><button onclick="location.reload()">Попробовать снова</button>';
}

reachable(DIRECT, 2500).then(function (ok) {
  if (ok) return go(DIRECT);
  reachable(FALLBACK, 4000).then(function (ok2) { ok2 ? go(FALLBACK) : fail(); });
});
</script>
</body>
</html>
